name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    name: PHP Syntax Check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php-cs-fixer
          coverage: none

      - name: Check PHP syntax errors
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./.github/*" \
            -print0 | xargs -0 -n1 php -l

      - name: Confirm no syntax errors found
        run: echo "✅ All PHP files passed syntax check for PHP ${{ matrix.php }}"

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    needs: php-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr
          coverage: none

      - name: Install PHP_CodeSniffer + WordPress standards
        run: |
          composer global require --dev \
            squizlabs/php_codesniffer \
            wp-coding-standards/wpcs \
            phpcompatibility/phpcompatibility-wp \
            dealerdirect/phpcodesniffer-composer-installer
          phpcs --version

      - name: Run PHPCS (WordPress Coding Standards)
        run: |
          phpcs \
            --standard=WordPress \
            --extensions=php \
            --ignore=vendor/,node_modules/ \
            --report=checkstyle \
            . | cs2pr || true
